version: 1
description: >
  Workspace-level routing index for requirements-coordinator-agent.
  Keep this file lightweight. It should help route requirements without reading
  every README or scanning every repository on each request.

index_policy:
  default_behavior: route_first
  avoid_full_workspace_scan: true
  read_readme_only_when:
    - service_manifest_missing
    - index_entry_stale
    - readme_listed_as_entrypoint
    - user_explicitly_requests_readme_inspection

services: []

