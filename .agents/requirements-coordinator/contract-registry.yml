version: 1
description: >
  共用 contract 的 workspace 層級註冊表。需求碰到某個 contract 時，
  應優先檢查這裡宣告的 owner、producer、consumer 或 participant，
  不要直接大範圍讀取所有服務 repository。

contracts: []

# 範例：
# contracts:
#   - id: invoice.created
#     type: event
#     domain: billing
#     owner_service: billing-api
#     producers:
#       - billing-api
#     consumers:
#       - notification-worker
#       - accounting-sync
#     schema_entrypoints:
#       - services/billing-api/events/invoice-created.schema.json
#     fields:
#       - invoice_id
#       - customer_id
#       - amount
#       - currency
#       - status
#       - created_at
#     compatibility:
#       mode: backward_compatible
#       notes:
#         - 不要在沒有 migration plan 的情況下移除或重新命名既有欄位。
#     review_checks:
#       - Producer 與 consumer 需要同意 required fields。
#       - 除非所有 consumer 都已更新，否則新增欄位應該保持 optional。
#       - Retry 與 idempotency 行為需要被記錄。
